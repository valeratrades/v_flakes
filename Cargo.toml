[package]
name = "v_flakes"
version = "0.1.4"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "Shared primitives for v_flakes nix module scripts"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/v_flakes"
include = [
    "src/**/*",
    "github/org_properties.json",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    ".cargo/*",
    "build.rs",
]

[package.metadata]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "v_flakes"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json"]
toml = ["dep:clap", "dep:toml_edit"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml_edit = { version = "0.25", optional = true }

[dev-dependencies]
insta = "1"
toml_edit = "0.25"
v_fixtures.version = "0.3.4"

[lints.rust]
unused_features = "allow"

[lints.clippy]
float_cmp = "allow"
len_zero = "allow"
comparison_to_empty = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
