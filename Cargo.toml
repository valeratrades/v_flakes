[package]
name = "v_flakes"
version = "0.1.2"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "CLI tools for v_flakes nix module management"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/v_flakes"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml_edit = "0.25"

[dev-dependencies]
insta = "1"
v_fixtures.version = "0.3.4"
